<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlix</title>

<style>
:root{
    --primary:#e50914;
    --bg:#000;
    --card:#111;
    --text:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
}

/* Header */
header{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    background:
    linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;
}

header h1{
    font-size:70px;
    color:var(--primary);
    animation:glow 2s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:0 0 10px red;
    }
    to{
        text-shadow:0 0 35px red;
    }
}

header p{
    font-size:25px;
    margin:20px 0;
}

/* Button */
button{
    padding:15px 35px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:var(--primary);
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff2a2a;
}
/* Movies Section */
.movies{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
    padding:20px 80px 50px;
    justify-items:center;
}

/* Movie Card */
.card{
    width:260px;
    background:#111;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(255,255,255,.2);

    opacity:0;
    transform:translateY(50px);
    transition:all .8s ease;
}

.card.show{
    opacity:1;
    transform:translateY(0);
}

.card img{
    width:100%;
    height:320px;   /* Reduced from 380px */
    object-fit:cover;
    transition:.4s;
}

.card h2{
    text-align:center;
    padding:12px;
    font-size:20px;
}

/* Footer */
footer{
    background:#111;
    padding:25px;
    text-align:center;
}

/* Responsive */
@media(max-width:900px){
    .movies{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .movies{
        grid-template-columns:1fr;
        padding:20px;
    }

    header h1{
        font-size:50px;
    }
}
</style>

</head>

<body>

<header>

<h1>🎬 CineFlix</h1>

<p>Unlimited Movies | Unlimited Entertainment</p>

<button onclick="scrollMovies()">
Explore Movies
</button>

</header>

<section class="movies" id="movies">

<div class="card">
<a href="https://www.netflix.com" target="_blank">
<img src="https://picsum.photos/400/600?1" alt="Action Movie">
</a>
<h2>Action Movie</h2>
</div>

<div class="card">
<a href="https://www.disneyplus.com" target="_blank">
<img src="https://picsum.photos/400/600?2" alt="Adventure Movie">
</a>
<h2>Adventure Movie</h2>
</div>

<div class="card">
<a href="https://www.primevideo.com" target="_blank">
<img src="https://picsum.photos/400/600?3" alt="Sci-Fi Movie">
</a>
<h2>Sci-Fi Movie</h2>
</div>

<div class="card">
<a href="https://www.hotstar.com" target="_blank">
<img src="https://picsum.photos/400/600?4" alt="Romantic Movie">
</a>
<h2>Romantic Movie</h2>
</div>

<div class="card">
<a href="https://www.sonyliv.com" target="_blank">
<img src="https://picsum.photos/400/600?5" alt="Horror Movie">
</a>
<h2>Horror Movie</h2>
</div>

<div class="card">
<a href="https://www.zee5.com" target="_blank">
<img src="https://picsum.photos/400/600?6" alt="Comedy Movie">
</a>
<h2>Comedy Movie</h2>
</div>

</section>

<footer>
<h2>© 2026 CineFlix</h2>
</footer>

<script>

// Smooth Scroll
function scrollMovies(){
    document.getElementById("movies").scrollIntoView({
        behavior:"smooth"
    });
}

// Reveal Animation
const observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
        if(entry.isIntersecting){
            entry.target.classList.add("show");
            observer.unobserve(entry.target);
        }
    });
},{
    threshold:0.2
});

document.querySelectorAll(".card").forEach(card=>{
    observer.observe(card);
});

</script>

</body>
</html>
